<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>

<!-- Kept in sync with --bg by core/theme.js. This is the pre-JS answer,
     so the browser chrome is right on first paint. -->
<meta name="theme-color" content="#18150f" id="meta-theme">

<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="mask-icon" href="/favicon.svg" color="#d6ae55">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<!-- The absolute URLs below are filled in at build time from the
     SITE_URL environment variable; see vite.config.js. The Pages
     workflow passes the real deployment URL, so they stay correct
     whether the site is served from a user page or from /<repo>/. -->
<link rel="canonical" href="__SITE_URL__">

<meta property="og:type" content="website">
<meta property="og:site_name" content="4LNsz">
<meta property="og:url" content="__SITE_URL__">
<meta property="og:title" content="Alan Sena — Software Engineer">
<meta property="og:description" content="Back-end. High-concurrency systems and real-time simulation.">
<meta property="og:image" content="__SITE_URL__og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Alan Sena, 4LNsz. Software engineer, back-end and real-time.">
<meta name="twitter:card" content="summary_large_image">

<!-- No font links: the three faces are served from this site. See
     src/styles/fonts.css. -->
<!-- The stylesheet is linked here, not imported by src/main.js. A link
     in the head holds the first paint until the CSS has arrived; an
     import is injected by the script, after the browser has already
     drawn the bare markup. In the built site Vite hoists an imported
     stylesheet into a link by itself, but the dev server does not, and
     every reload there opened on an unstyled page with the A-quatro
     filling the window. -->
<link rel="stylesheet" href="/src/styles/main.css">
<!-- Set before the first paint, not from the deferred module in
     src/main.js: base.css hides the hero and every .rv element behind
     `html.js`, and a module that runs after the browser has already
     painted would show them settled for one frame and then yank them
     back down to animate.

     Hiding things on the promise of a script is only safe if the promise
     can be taken back, so this also watches for the bundle not keeping
     it. If the bundle fails to load, throws while starting, or has said
     nothing after four seconds, `js` comes off again and nothing stays
     hidden: before the page has been rendered that leaves the static
     card (see vite.config.js); after it, the whole page, at rest.
     src/main.js calls window.__boot() as its last line to say it made
     it. A bundle that turns up late simply starts as usual.

     It also sets a saved theme. core/theme.js does that as well, but
     only once the bundle has run, and a visitor who had chosen light was
     shown the dark page first, fading across on every load. -->
<script>
(function (root) {
  try {
    var saved = localStorage.getItem("4lnsz:theme");
    if (saved === "light" || saved === "dark") root.setAttribute("data-theme", saved);
  } catch (e) {}
  var alive = false;
  function giveUp() {
    if (alive) return;
    root.classList.remove("js");
    if (root.classList.contains("ready")) root.classList.add("settled");
  }
  function onError(e) {
    // A script that could not be fetched reports on its own element; one
    // that threw reports on the window. Images and stylesheets do not count.
    var t = e.target;
    if (t === window || (t && t.tagName === "SCRIPT")) giveUp();
  }
  var timer = setTimeout(giveUp, 4000);
  window.addEventListener("error", onError, true);
  window.__boot = function () {
    alive = true;
    clearTimeout(timer);
    window.removeEventListener("error", onError, true);
  };
  root.classList.add("js");
})(document.documentElement);
</script>
</head>

<body>

<a class="skip" href="#main" data-i18n="ui.skip"></a>

<!-- ══ HEADER ══ -->
<header>
  <!-- The A-quatro stands where the 4 of the handle would be, so the
       link needs its real name spelled out for anyone not looking. The
       drawing is the polygons of brand/a-quatro.svg, printed by
       brand/src/build.mjs; the letters beside it are type. A brand
       glyph, not prose: it stays out of the locale files. -->
  <a href="#hero" class="brand" aria-label="4LNsz">
    <svg viewBox="0 0 92 100" width="25" height="27" fill="currentColor" aria-hidden="true"><polygon points="72,0 0,100 16,100 58,41.7 58,100 72,100"/><polygon points="27.4,62 92,62 92,75 18,75"/></svg><span aria-hidden="true">LN<small>sz</small></span>
  </a>

  <nav class="nav" aria-label="Primary">
    <a href="#profile" data-i18n="nav.profile"></a>
    <a href="#stack" data-i18n="nav.stack"></a>
    <a href="#practice" data-i18n="nav.practice"></a>
    <a href="#path" data-i18n="nav.path"></a>
    <a href="#contact" data-i18n="nav.contact"></a>
  </nav>

  <div class="hud">
    <div class="lang" id="lang"></div>
    <button class="icon-btn" id="theme" type="button">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <circle cx="12" cy="12" r="9.2" fill="none" stroke="currentColor" stroke-width="1.7"/>
        <path d="M12 2.8a9.2 9.2 0 0 0 0 18.4z" fill="currentColor"/>
      </svg>
    </button>
    <button class="icon-btn nav-toggle" id="nav-toggle" type="button"
            aria-expanded="false" aria-controls="nav-drawer"
            data-i18n-attr="aria-label:ui.menu">
      <i aria-hidden="true"></i><i aria-hidden="true"></i><i aria-hidden="true"></i>
    </button>
  </div>
</header>

<!-- Sibling of <header>, not a child: the header can slide out of view
     on scroll, and a drawer inside it would leave with it.
     Links are cloned in by core/nav.js. -->
<nav class="nav-drawer" id="nav-drawer" aria-label="Mobile" aria-hidden="true"></nav>

<main id="main">

<!-- The static card: name, channels and CVs, for a visitor whose script
     never runs. vite.config.js writes it here from src/config.js. -->
<!-- __STATIC_CARD__ -->

<!-- ══ HERO · the sheet ══ -->
<section id="hero">
  <div class="wrap sheet" id="sheet">

    <div class="sheet__l">
      <!-- "Alan Sena" is a proper noun, not translated prose. -->
      <div class="hero-id">
        <h1 class="hero-name">Alan Sena</h1>
        <p class="hero-role"><span data-i18n="hero.role"></span><span data-i18n="hero.spec"></span><span data-i18n="hero.focus"></span></p>
      </div>
      <ol class="callouts callouts--l" id="callouts-a"></ol>
      <p class="hero-statement" data-i18n="hero.statement"></p>
    </div>

    <!-- A real simulation, not a backdrop: motion/field.js steps every
         dot, and the ring and the record below report what that costs. -->
    <figure class="dial" id="dial">
      <canvas id="field" class="dial__field" role="img" data-i18n-attr="aria-label:hero.figLabel"></canvas>
      <svg class="dial__ring" id="ring" aria-hidden="true"></svg>
      <!-- The one thing on the page nobody would guess: the field takes
           load where it is pressed. sections/hero.js picks "click" or
           "tap" for the device. -->
      <figcaption class="dial__hint" id="dial-hint"></figcaption>
    </figure>

    <!-- The three figures that matter, straight under the dial. Shown on
         a phone only, where the full readout is a screen and a half
         further down. Hidden from assistive tech because that readout
         says the same thing, with its controls. -->
    <dl class="mini" id="hero-mini" aria-hidden="true">
      <div><dt data-i18n="hero.hud.sessions"></dt><dd data-mini="sessions">0</dd></div>
      <div><dt data-i18n="hero.hud.tick"></dt><dd><span data-mini="tick">0</span><small>ms</small></dd></div>
      <div><dt data-i18n="hero.hud.budget"></dt><dd><span data-mini="budget">0</span><small>%</small></dd></div>
    </dl>

    <div class="sheet__r">
      <ol class="callouts callouts--r" id="callouts-b" start="3"></ol>
      <dl class="ficha">
        <div><dt data-i18n="meta.based"></dt><dd data-i18n="hero.based"></dd></div>
        <div><dt data-i18n="meta.time"></dt><dd id="clock">--:--:--</dd></div>
      </dl>
      <div class="doors" id="doors"></div>
    </div>

    <svg class="leaders" id="leaders" aria-hidden="true"></svg>
  </div>

  <div class="strip">
    <div class="wrap strip__in">
      <div class="strip__lab">
        <h2 data-i18n="hero.strip.title"></h2>
        <!-- Two clauses, two spans: each wraps by itself, so the line
             never breaks one word past the semicolon. -->
        <p><span data-i18n="hero.strip.note.0"></span> <span data-i18n="hero.strip.note.1"></span></p>
      </div>
      <div class="strip__plot">
        <canvas id="trace" aria-hidden="true"></canvas>
        <p class="strip__scale" data-i18n="hero.strip.scale"></p>
      </div>
      <div class="hero-instr" id="hero-instr"></div>
    </div>
  </div>
</section>

<!-- ══ PERFIL ══ -->
<section id="profile" class="wrap sec" aria-labelledby="profile-h">
  <h2 class="sec-h" id="profile-h" data-i18n="nav.profile"></h2>
  <div class="pf">
    <div class="pf-about rv" id="profile-about"></div>
    <dl class="pf-blocks" id="profile-blocks"></dl>
  </div>
</section>

<!-- ══ STACK ══ -->
<section id="stack" class="wrap sec" aria-labelledby="stack-h">
  <h2 class="sec-h" id="stack-h" data-i18n="nav.stack"></h2>
  <div class="parts" id="stack-rows"></div>
</section>

<!-- ══ ATUAÇÃO ══ -->
<section id="practice" class="wrap sec" aria-labelledby="practice-h">
  <h2 class="sec-h" id="practice-h" data-i18n="nav.practice"></h2>
  <ul class="funcs" id="practice-rows" role="list"></ul>
</section>

<!-- ══ TRAJETÓRIA ══ -->
<section id="path" class="wrap sec" aria-labelledby="path-h">
  <h2 class="sec-h" id="path-h" data-i18n="nav.path"></h2>
  <figure class="graph rv" id="path-graph"></figure>
  <div class="rec" id="path-rows"></div>
  <div class="cv-row" id="cv-row"></div>
</section>

<!-- ══ CONTATO ══ -->
<section id="contact" aria-labelledby="contact-h">
  <div class="wrap sec">
    <h2 class="sec-h contact-big" id="contact-h" data-i18n="contact.big"></h2>
    <div class="channels" id="channels"></div>
  </div>

  <footer class="wrap">
    <!-- The rubric: the polygons of brand/as.svg. -->
    <svg viewBox="0 0 138 100" width="44" height="32" fill="currentColor" aria-hidden="true"><polygon points="72,0 0,100 16,100 58,41.7 58,100 72,100"/><polygon points="25.2,65 112,65 112,78 15.8,78"/><polygon points="138,0 94.31,0 84,10.31 84,46.19 94.31,56.5 120.31,56.5 123,59.19 123,84.31 120.31,87 84,87 84,100 125.69,100 136,89.69 136,53.81 125.69,43.5 99.69,43.5 97,40.81 97,15.69 99.69,13 138,13"/></svg>
    <span>&copy; <span id="year"></span> Alan Sena &middot; 4LNsz</span>
  </footer>
</section>

</main>

<!-- No <noscript> block: with scripting off the inline script in the
     head never sets `js`, which is the same state a failed bundle is
     put back into, and the static card above covers both. -->

<script type="module" src="/src/main.js"></script>
</body>
</html>
