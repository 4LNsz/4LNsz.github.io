<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alan — Software Engineer</title>
<meta name="description" content="Engenheiro de software back-end. Sistemas de alta concorrência e simulação em tempo real.">
<meta name="author" content="Alan — 4LNsz">

<!-- Kept in sync with --bg by core/theme.js. This is the pre-JS answer,
     so the browser chrome is right on first paint. -->
<meta name="theme-color" content="#0a1413" id="meta-theme">

<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="mask-icon" href="/favicon.svg" color="#45dfd0">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<!-- The absolute URLs below are filled in at build time from the
     SITE_URL environment variable; see vite.config.js. The Pages
     workflow passes the real deployment URL, so they stay correct
     whether the site is served from a user page or from /<repo>/. -->
<link rel="canonical" href="__SITE_URL__">

<meta property="og:type" content="website">
<meta property="og:site_name" content="4LNsz">
<meta property="og:url" content="__SITE_URL__">
<meta property="og:title" content="Alan — Software Engineer">
<meta property="og:description" content="Back-end. High-concurrency systems and real-time simulation.">
<meta property="og:image" content="__SITE_URL__og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="ALAN — 4LNsz. Software engineer, back-end and real-time.">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62.5..125,300..800&family=Chivo+Mono:wght@300..600&display=swap" rel="stylesheet">
</head>

<body>

<a class="skip" href="#main" data-i18n="ui.skip"></a>

<!-- ══ PRELOADER ══ -->
<div id="loader" aria-hidden="true">
  <div class="loader-mask"><span id="loader-word">ALAN</span></div>
  <div class="loader-count" id="loader-count">000</div>
  <div class="loader-bar"><i id="loader-fill"></i></div>
</div>

<!-- ══ HEADER ══ -->
<header>
  <a href="#hero" class="brand">4<em>LN</em>sz</a>

  <nav class="nav" aria-label="Primary">
    <a href="#profile"><i>01</i><span data-i18n="nav.profile"></span></a>
    <a href="#stack"><i>02</i><span data-i18n="nav.stack"></span></a>
    <a href="#practice"><i>03</i><span data-i18n="nav.practice"></span></a>
    <a href="#path"><i>04</i><span data-i18n="nav.path"></span></a>
    <a href="#contact"><i>05</i><span data-i18n="nav.contact"></span></a>
  </nav>

  <div class="hud">
    <button class="icon-btn" id="theme" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9.4" fill="none" stroke="currentColor" stroke-width="1.7"/>
        <path d="M12 2.6a9.4 9.4 0 0 0 0 18.8z" fill="currentColor"/>
      </svg>
    </button>
    <div class="lang" id="lang" role="group" aria-label="Language"></div>
    <button class="icon-btn nav-toggle" id="nav-toggle" type="button"
            aria-expanded="false" aria-controls="nav-drawer"
            data-i18n-attr="aria-label:ui.menu">
      <i aria-hidden="true"></i><i aria-hidden="true"></i><i aria-hidden="true"></i>
    </button>
  </div>
</header>

<!-- Sibling of <header>, not a child: the header can slide out of view
     on scroll, and a drawer inside it would leave with it.
     Links are cloned in by core/nav.js. -->
<nav class="nav-drawer" id="nav-drawer" aria-label="Mobile" aria-hidden="true"></nav>

<main id="main">

<!-- ══ 00 · HERO ══ -->
<section id="hero" class="wrap">
  <!-- ONE strip, not two. This row held status, the clock and a scroll
       cue spread across the full width — 40% ink, 60% air — and a second
       three-cell strip sat below the name carrying role, base and focus.
       Two half-empty bands. Merged, the five fields fill one band and
       the hero loses a whole row of height. -->
  <div class="hero-strip">
    <div>
      <span class="k mono-xs" data-i18n="meta.status"></span>
      <span class="v hero-status" data-i18n="hero.status"></span>
    </div>
    <div>
      <span class="k mono-xs" data-i18n="meta.role"></span>
      <span class="v" data-i18n="hero.role"></span>
    </div>
    <div>
      <span class="k mono-xs" data-i18n="meta.based"></span>
      <span class="v" data-i18n="hero.based"></span>
    </div>
    <div>
      <span class="k mono-xs" data-i18n="meta.focus"></span>
      <span class="v" data-i18n="hero.focus"></span>
    </div>
    <div>
      <span class="k mono-xs" data-i18n="meta.time"></span>
      <span class="v" id="clock">--:--:--</span>
    </div>
  </div>

  <div class="hero-body">
    <!-- "Alan Sena" and "4LNsz" are proper nouns, not translated prose —
         same treatment as the header brand. -->
    <div class="hero-main">
      <p class="hero-eyebrow mono-xs">4LNsz</p>
      <h1 class="hero-name">Alan Sena</h1>
      <p class="hero-statement" data-i18n="hero.statement"></p>
    </div>

    <!-- A real simulation, not a backdrop: motion/field.js steps every
         dot and the readout below reports what stepping them costs. -->
    <div class="hero-rig">
      <canvas id="field" class="hero-rig__field" aria-hidden="true"></canvas>
      <div class="hero-instr" id="hero-instr"></div>
    </div>
  </div>

</section>

<div class="marquee" id="marquee" aria-hidden="true"></div>

<!-- ══ 01 · PROFILE ══ -->
<section id="profile" class="wrap" aria-labelledby="profile-h">
  <div class="sec-head mono-xs">
    <span class="idx">01</span>
    <span id="profile-h" data-i18n="nav.profile"></span>
    <span class="ttl" data-i18n="profile.kicker"></span>
  </div>
  <div class="pf-about rv" id="profile-about"></div>
  <div class="pf-blocks" id="profile-blocks"></div>
</section>

<!-- ══ 02 · STACK ══ -->
<section id="stack" class="wrap" aria-labelledby="stack-h">
  <div class="sec-head mono-xs">
    <span class="idx">02</span>
    <span id="stack-h" data-i18n="nav.stack"></span>
    <span class="ttl" data-i18n="stack.kicker"></span>
  </div>
  <div id="stack-rows"></div>
</section>

<!-- ══ 03 · PRACTICE ══ -->
<section id="practice" aria-labelledby="practice-h">
  <div class="wrap practice-head">
    <div class="sec-head mono-xs">
      <span class="idx">03</span>
      <span id="practice-h" data-i18n="nav.practice"></span>
      <span class="ttl" data-i18n="practice.kicker"></span>
    </div>
  </div>
  <div class="practice-pin" id="practice-pin">
    <div class="practice-track" id="practice-track"></div>
  </div>
  <div class="practice-progress" aria-hidden="true"><i id="practice-fill"></i></div>
  <div class="practice-foot mono-xs">
    <span data-i18n="practice.hint"></span>
    <span id="practice-counter">01 / 04</span>
  </div>
</section>

<!-- ══ 04 · PATH ══ -->
<section id="path" class="wrap" aria-labelledby="path-h">
  <div class="sec-head mono-xs">
    <span class="idx">04</span>
    <span id="path-h" data-i18n="nav.path"></span>
    <span class="ttl" data-i18n="path.kicker"></span>
  </div>
  <div id="path-rows"></div>
  <div class="cv-row" id="cv-row"></div>
</section>

<!-- ══ 05 · CONTACT ══ -->
<section id="contact" aria-labelledby="contact-h">
  <div class="wrap">
    <div class="sec-head mono-xs">
      <span class="idx">05</span>
      <span id="contact-h" data-i18n="nav.contact"></span>
      <span class="ttl" data-i18n="contact.kicker"></span>
    </div>

    <h2 class="contact-big" data-chars data-i18n="contact.big"></h2>

    <div class="channels" id="channels"></div>
  </div>

  <footer class="mono-xs">
    <span>&copy; <span id="year"></span> Alan &middot; 4LNsz</span>
  </footer>
</section>

</main>

<!-- No <noscript> fallback needed: the pre-animation states are scoped to
     html.js and #loader is hidden by html:not(.js), both in base.css, so
     a bundle that never runs leaves the page fully readable. -->

<script type="module" src="/src/main.js"></script>
</body>
</html>
